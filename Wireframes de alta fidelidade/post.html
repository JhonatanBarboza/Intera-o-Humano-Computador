<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Post — Patas que Acolhem</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="home.html">
      <span class="brand__mark">🐾</span>
      <span class="brand__text">
        <h1>Patas que Acolhem</h1>
        <span>Mais lares. Mais histórias felizes.</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="home.html">🏠 Início</a>
      <a href="mapa-abrigos.html">🏢 Abrigos</a>
      <a href="favoritos.html">♥ Favoritos <span class="nav-fav-badge" data-favoritos-count>0</span></a>
      <a href="feed.html" class="active">📰 Resgates &amp; Eventos</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="login.html">Área da instituição</a>
      <a class="btn btn-primary btn-sm" href="institucional.html?id=esperanca">♥ Quero Ajudar</a>
    </div>
  </header>

  <main class="container" style="max-width:820px;">
    <a class="back-link" href="feed.html" style="color:#fff;">← Voltar para Resgates &amp; Eventos</a>

    <div class="panel" id="postConteudo"></div>
  </main>

  <footer class="site-footer">Juntos por um mundo com mais lares e menos abandono. ♥</footer>
</div>

<script src="js/data.js"></script>
<script src="js/favoritos.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const post = getPostById(params.get("id")) || POSTS[0];
  const abrigo = getAbrigoById(post.abrigoId);
  const emoji = post.tipo === "resgate" ? "🐾" : "🎉";

  document.getElementById("pageTitle").textContent = `${post.titulo} — Patas que Acolhem`;

  document.getElementById("postConteudo").innerHTML = `
    <div class="post-detalhe-hero">${emoji}</div>
    <div class="post-card__meta" style="margin-bottom:10px;">
      <span class="post-tipo ${post.tipo}">${post.tipo === "resgate" ? "Resgate" : "Evento"}</span>
      <span>${post.dataFormatada}</span>
    </div>
    <h1 style="font-size:26px;">${post.titulo}</h1>
    <a href="institucional.html?id=${abrigo.id}" style="display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--terracota-dark); margin-bottom:18px;">
      ${abrigo.icone} ${abrigo.nome} →
    </a>
    <p class="post-detalhe-corpo">${post.corpo}</p>
  `;
</script>
</body>
</html>
