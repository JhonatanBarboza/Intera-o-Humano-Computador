<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapa dos Abrigos — Patas que Acolhem</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="home.html">
      <span class="brand__mark">🐾</span>
      <span class="brand__text">
        <h1>Patas que Acolhem</h1>
        <span>Mais lares. Mais histórias felizes.</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="home.html">🏠 Início</a>
      <a href="mapa-abrigos.html" class="active">🏢 Abrigos</a>
      <a href="favoritos.html">♥ Favoritos <span class="nav-fav-badge" data-favoritos-count>0</span></a>
      <a href="feed.html">📰 Resgates &amp; Eventos</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="login.html">Área da instituição</a>
      <a class="btn btn-primary btn-sm" href="institucional.html?id=esperanca">♥ Quero Ajudar</a>
    </div>
  </header>

  <main class="container">
    <div class="resultado-header" style="margin-top:4px;">
      <strong style="font-family: var(--fonte-titulo); font-size:22px; color:#fff;">🏢 Abrigos participantes</strong>
      <select class="select-field" id="filtroCidade" style="max-width:220px;">
        <option value="todos">Todas as cidades</option>
        <option value="São Carlos">São Carlos - SP</option>
        <option value="Ribeirão Preto">Ribeirão Preto - SP</option>
      </select>
    </div>

    <div class="mapa-layout" style="margin-top:16px;">
      <div class="mapa-grande" id="mapaGrande"></div>
      <div class="abrigos-lista" id="abrigosLista"></div>
    </div>
  </main>

  <footer class="site-footer">Juntos por um mundo com mais lares e menos abandono. ♥</footer>
</div>

<script src="js/data.js"></script>
<script src="js/favoritos.js"></script>
<script>
  function markerHTML(abrigo) {
    return `
      <div class="mapa-marker" style="top:${abrigo.mapaPos.top}; left:${abrigo.mapaPos.left};" data-abrigo="${abrigo.id}">
        <div class="mapa-marker__tooltip">
          <h4>${abrigo.icone} ${abrigo.nome}</h4>
          <p>📍 ${abrigo.cidade}</p>
          <a class="btn btn-primary btn-sm btn-block" href="institucional.html?id=${abrigo.id}">Ver página →</a>
        </div>
        <div class="mapa-marker__pin"><span>${abrigo.icone}</span></div>
      </div>
    `;
  }

  function listaItemHTML(abrigo) {
    const qtdAnimais = getAnimaisPorAbrigo(abrigo.id).filter((a) => a.status !== "adotado").length;
    return `
      <div class="abrigo-list-item" data-abrigo="${abrigo.id}">
        <span class="abrigo-list-item__icon">${abrigo.icone}</span>
        <div style="flex:1;">
          <h4>${abrigo.nome}</h4>
          <p>📍 ${abrigo.cidade}</p>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
            <span class="chip">🐾 ${qtdAnimais} ${qtdAnimais === 1 ? "disponível" : "disponíveis"}</span>
          </div>
          <a class="btn btn-secondary btn-sm" href="institucional.html?id=${abrigo.id}">Ver página institucional →</a>
        </div>
      </div>
    `;
  }

  function renderMapa(lista) {
    document.getElementById("mapaGrande").innerHTML = lista.map(markerHTML).join("");
    document.getElementById("abrigosLista").innerHTML = lista.map(listaItemHTML).join("");
    ativarInteracao();
  }

  function ativarInteracao() {
    document.querySelectorAll(".mapa-marker, .abrigo-list-item").forEach((el) => {
      el.addEventListener("mouseenter", () => destacar(el.getAttribute("data-abrigo")));
      el.addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        destacar(el.getAttribute("data-abrigo"));
      });
    });
  }

  function destacar(abrigoId) {
    document.querySelectorAll(".mapa-marker").forEach((m) => m.classList.toggle("is-active", m.getAttribute("data-abrigo") === abrigoId));
    document.querySelectorAll(".abrigo-list-item").forEach((m) => m.classList.toggle("is-active", m.getAttribute("data-abrigo") === abrigoId));
  }

  document.getElementById("filtroCidade").addEventListener("change", (e) => {
    const valor = e.target.value;
    const lista = valor === "todos" ? ABRIGOS : ABRIGOS.filter((a) => a.cidade.startsWith(valor));
    renderMapa(lista);
  });

  renderMapa(ABRIGOS);
</script>
</body>
</html>
