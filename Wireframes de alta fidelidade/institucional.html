<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Página institucional — Patas que Acolhem</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="home.html">
      <span class="brand__mark">🐾</span>
      <span class="brand__text">
        <h1>Patas que Acolhem</h1>
        <span>Mais lares. Mais histórias felizes.</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="home.html">🏠 Início</a>
      <a href="mapa-abrigos.html" class="active">🏢 Abrigos</a>
      <a href="favoritos.html">♥ Favoritos <span class="nav-fav-badge" data-favoritos-count>0</span></a>
      <a href="feed.html">📰 Resgates &amp; Eventos</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="login.html">Área da instituição</a>
      <a class="btn btn-primary btn-sm" id="btnAjudarTopo" href="#ajudar">♥ Quero Ajudar</a>
    </div>
  </header>

  <main class="container" id="conteudoInstitucional"></main>

  <footer class="site-footer">Juntos por um mundo com mais lares e menos abandono. ♥</footer>
</div>

<script src="js/data.js"></script>
<script src="js/favoritos.js"></script>
<script src="js/components.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const abrigoId = params.get("id") || "esperanca";
  const abrigo = getAbrigoById(abrigoId) || ABRIGOS[0];
  const animais = getAnimaisPorAbrigo(abrigo.id);
  const posts = getPostsPorAbrigo(abrigo.id).sort((a, b) => (a.data < b.data ? 1 : -1));

  document.getElementById("pageTitle").textContent = `${abrigo.nome} — Patas que Acolhem`;

  document.getElementById("conteudoInstitucional").innerHTML = `
    <div class="inst-hero">
      <span class="inst-hero__icon">${abrigo.icone}</span>
      <div>
        <div class="inst-hero__local">📍 ${abrigo.cidade}</div>
        <h1>${abrigo.nome}</h1>
        <p>${abrigo.slogan}</p>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="section-title"><span class="icon-badge">🏢</span> Sobre a instituição</div>
        <p style="color:var(--texto-suave); font-size:14.5px; margin-top:14px;">${abrigo.sobre}</p>
        <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; font-size:13.5px; color:var(--texto-suave);">
          <span>📍 ${abrigo.endereco}</span>
          <span>📞 ${abrigo.telefone}</span>
          <span>✉️ ${abrigo.email}</span>
        </div>
      </div>

      <div class="panel" id="ajudar">
        <div class="section-title"><span class="icon-badge">♥</span> Como ajudar</div>
        <p class="section-sub" style="margin-top:2px;">Sua ajuda faz toda a diferença!</p>
        <div class="ajuda-lista">
          <div class="ajuda-item">
            <span class="ajuda-item__icon">♥</span>
            <div><h4>Doações</h4><p>Ajude com ração, medicamentos e custos veterinários.</p></div>
          </div>
          <div class="ajuda-item">
            <span class="ajuda-item__icon">🙋</span>
            <div><h4>Voluntariado</h4><p>Doe seu tempo e carinho para os animais do abrigo.</p></div>
          </div>
          <div class="ajuda-item">
            <span class="ajuda-item__icon">🎗️</span>
            <div><h4>Apadrinhamento</h4><p>Apadrinhe um animal com contribuição mensal recorrente.</p></div>
          </div>
        </div>
        <a class="btn btn-primary btn-block" href="#" onclick="alert('Protótipo: aqui a plataforma redirecionaria para um link externo de doação (PIX, Vakinha, PagSeguro etc.)'); return false;">♥ Quero ajudar agora</a>
      </div>
    </div>

    <div class="panel">
      <div class="resultado-header" style="margin-bottom:6px;">
        <div class="section-title" style="margin-bottom:0;"><span class="icon-badge">🐾</span> Animais deste abrigo</div>
        <a class="btn btn-secondary btn-sm" href="home.html">Ver todos →</a>
      </div>
      <p class="section-sub">Conheça alguns dos nossos animais que estão em busca de um lar</p>
      <div class="animal-grid" id="gridAnimaisAbrigo"></div>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="section-title"><span class="icon-badge">📅</span> Últimos resgates e eventos</div>
        <div id="feedMini" style="margin-top:10px;"></div>
      </div>
      <div class="panel">
        <div class="section-title"><span class="icon-badge">📊</span> Nosso impacto</div>
        <div class="impacto-row" style="margin-top:14px;">
          <div class="impacto-box"><strong>${abrigo.impacto.resgatados}</strong><span>Animais resgatados</span></div>
          <div class="impacto-box"><strong>${abrigo.impacto.adocoes}</strong><span>Adoções realizadas</span></div>
          <div class="impacto-box"><strong>${abrigo.impacto.voluntarios}</strong><span>Voluntários ativos</span></div>
        </div>
      </div>
    </div>
  `;

  renderAnimalGrid(document.getElementById("gridAnimaisAbrigo"), animais, "Este abrigo ainda não tem animais cadastrados");

  const feedMini = document.getElementById("feedMini");
  if (!posts.length) {
    feedMini.innerHTML = `<p style="color:var(--texto-suave); font-size:13.5px;">Nenhuma publicação recente.</p>`;
  } else {
    feedMini.innerHTML = posts
      .slice(0, 3)
      .map((p) => {
        const [, mes, dia] = p.data.split("-");
        const nomesMes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
        return `
        <a class="feed-mini-item" href="post.html?id=${p.id}">
          <div class="feed-mini-item__data"><span class="dia">${dia}</span><span class="mes">${nomesMes[Number(mes) - 1]}</span></div>
          <div>
            <h4>${p.titulo}</h4>
            <p>${p.resumo}</p>
          </div>
        </a>
      `;
      })
      .join("");
  }
</script>
</body>
</html>
