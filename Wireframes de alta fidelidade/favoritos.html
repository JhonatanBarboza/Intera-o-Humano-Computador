<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meus Favoritos — Patas que Acolhem</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="home.html">
      <span class="brand__mark">🐾</span>
      <span class="brand__text">
        <h1>Patas que Acolhem</h1>
        <span>Mais lares. Mais histórias felizes.</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="home.html">🏠 Início</a>
      <a href="mapa-abrigos.html">🏢 Abrigos</a>
      <a href="favoritos.html" class="active">♥ Favoritos <span class="nav-fav-badge" data-favoritos-count>0</span></a>
      <a href="feed.html">📰 Resgates &amp; Eventos</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="login.html">Área da instituição</a>
      <a class="btn btn-primary btn-sm" href="institucional.html?id=esperanca">♥ Quero Ajudar</a>
    </div>
  </header>

  <main class="container">
    <div class="resultado-header" style="margin-top:4px;">
      <strong style="font-family: var(--fonte-titulo); font-size:22px; color:#fff;">♥ Meus Favoritos</strong>
      <span id="favContagem" style="color:#f6e6e2; font-size:13.5px;"></span>
    </div>

    <div class="animal-grid" id="gridFavoritos" style="margin-top:16px;"></div>
  </main>

  <footer class="site-footer">Juntos por um mundo com mais lares e menos abandono. ♥</footer>
</div>

<script src="js/data.js"></script>
<script src="js/favoritos.js"></script>
<script src="js/components.js"></script>
<script>
  function carregarFavoritos() {
    const ids = getFavoritos();
    const animais = ANIMAIS.filter((a) => ids.includes(a.id));
    const grid = document.getElementById("gridFavoritos");

    if (!animais.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <span class="empty-state__icon">💔</span>
          <h3>Você ainda não favoritou nenhum animal</h3>
          <p>Explore os animais disponíveis e clique no ♡ para guardar aqui os que mais chamaram sua atenção.</p>
          <a class="btn btn-primary" href="home.html">🔎 Buscar animais</a>
        </div>
      `;
      document.getElementById("favContagem").textContent = "";
      return;
    }

    grid.innerHTML = animais.map(animalCardHTML).join("");
    attachFavButtons(grid);
    document.getElementById("favContagem").textContent =
      animais.length === 1 ? "1 animal favoritado" : `${animais.length} animais favoritados`;

    // reagir ao clique de desfavoritar removendo o card da lista
    grid.querySelectorAll("[data-fav-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => {
        setTimeout(carregarFavoritos, 120);
      });
    });
  }

  carregarFavoritos();
</script>
</body>
</html>
