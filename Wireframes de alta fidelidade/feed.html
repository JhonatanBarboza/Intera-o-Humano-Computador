<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="home.html">
      <span class="brand__mark">🐾</span>
      <span class="brand__text">
        <h1>Patas que Acolhem</h1>
        <span>Mais lares. Mais histórias felizes.</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="home.html">🏠 Início</a>
      <a href="mapa-abrigos.html">🏢 Abrigos</a>
      <a href="favoritos.html">♥ Favoritos <span class="nav-fav-badge" data-favoritos-count>0</span></a>
      <a href="feed.html" class="active">📰 Resgates &amp; Eventos</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="login.html">Área da instituição</a>
      <a class="btn btn-primary btn-sm" href="institucional.html?id=esperanca">♥ Quero Ajudar</a>
    </div>
  </header>

  <main class="container">
    <div class="resultado-header" style="margin-top:4px;">
      <strong style="font-family: var(--fonte-titulo); font-size:22px; color:#fff;">📰 Resgates &amp; Eventos</strong>
      <span style="color:#f6e6e2; font-size:13.5px;">Novidades de todos os abrigos parceiros</span>
    </div>

    <div class="feed-filtros">
      <button class="filtro-chip is-selected" data-tipo="todos">Todos</button>
      <button class="filtro-chip" data-tipo="resgate">🐾 Resgates</button>
      <button class="filtro-chip" data-tipo="evento">📅 Eventos</button>
    </div>

    <div class="post-lista" id="postLista"></div>
  </main>

  <footer class="site-footer">Juntos por um mundo com mais lares e menos abandono. ♥</footer>
</div>

<script src="js/data.js"></script>
<script src="js/favoritos.js"></script>
<script>
  const nomesMes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

  function postCardHTML(post) {
    const abrigo = getAbrigoById(post.abrigoId);
    const emoji = post.tipo === "resgate" ? "🐾" : "🎉";
    return `
      <a class="post-card" href="post.html?id=${post.id}">
        <div class="post-card__foto">${emoji}</div>
        <div class="post-card__body">
          <div class="post-card__meta">
            <span class="post-tipo ${post.tipo}">${post.tipo === "resgate" ? "Resgate" : "Evento"}</span>
            <span>${post.dataFormatada}</span>
            <span>· ${abrigo.nome}</span>
          </div>
          <h3>${post.titulo}</h3>
          <p>${post.resumo}</p>
        </div>
      </a>
    `;
  }

  function renderPosts(tipo) {
    let lista = POSTS.slice().sort((a, b) => (a.data < b.data ? 1 : -1));
    if (tipo !== "todos") lista = lista.filter((p) => p.tipo === tipo);
    document.getElementById("postLista").innerHTML = lista.map(postCardHTML).join("");
  }

  document.querySelectorAll("[data-tipo]").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("[data-tipo]").forEach((c) => c.classList.remove("is-selected"));
      chip.classList.add("is-selected");
      renderPosts(chip.getAttribute("data-tipo"));
    });
  });

  renderPosts("todos");
</script>
</body>
</html>
